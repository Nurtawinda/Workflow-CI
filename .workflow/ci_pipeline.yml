name: CI Pipeline - MLflow Project & Docker Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode dari repositori
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Siapkan lingkungan Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # 3. Install semua library yang dibutuhkan proyek
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn mlflow dagshub matplotlib seaborn

    # 4. Jalankan MLProject (Mengembalikan Artefak Terbaru)
    - name: Run MLflow Project
      run: |
        mlflow run MLProject --env-manager=local

    # 5. Login ke Docker Hub secara aman menggunakan Secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 6. Build Docker Image menggunakan fungsi bawaan MLflow
    - name: Build Docker Image via MLflow
      run: |
        mlflow models build-docker -m "MLProject/mlruns/0" -n "${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-model:latest" --env-manager=local

    # 7. Push Docker Image ke Docker Hub Cloud
    - name: Push Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/credit-risk-model:latest
